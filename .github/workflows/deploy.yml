name: Deploy

# Every push to main publishes www.codefyui.com on GitHub Pages.
# Pull requests only build, so a broken change is caught before it merges.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # daily rebuild so the release tag and star count read at build time stay current
    - cron: '17 3 * * *'

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # lets src/data/release.ts read the latest CodefyUI release without hitting the anonymous rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
